name: Dart

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test_and_analyze:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el código de la app
      uses: actions/checkout@v4

    # ESTE ES EL PASO CLAVE QUE FALTABA: Instala Flutter en el servidor
    - name: Instalar Flutter en el servidor
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # Ahora sí, usamos comandos de flutter, no de dart
    - name: Instalar dependencias
      run: flutter pub get

    - name: Verificar calidad del código (Linter)
      run: flutter analyze

    - name: Ejecutar Tests Automatizados
      run: flutter test
